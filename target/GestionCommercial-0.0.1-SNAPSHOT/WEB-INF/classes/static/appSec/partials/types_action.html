<div class="view_contents" ng-controller="typesActionCtrl">
	<h3>{{title}}</h3>
	<table>
		<thead>
			<tr>
				<th>#</th>
				<th>Libellé</th>
				<th>Commentaire</th>
				<th>Action</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="typeaction in typesaction">
				<td>{{typeaction.id}}</td>
				<td>{{typeaction.caption}}</td>
				<td>{{typeaction.comment}}</td>

				<td>
					<a href="#/typesaction/{{typeaction.id}}">edit</a>
					&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
					<a ng-click="onDelete(typeaction.id)" style="cursor: pointer;">remove</a>
				</td>
			</tr>
			<tr>
				<td colspan="3">New typesaction :
					<form ng-submit="onInsert()" style="display: inline;">
						<br><label>Libellé : <input type="text" ng-model="inserted.caption"></label>
						<br><label>Commantaire : <input type="text"  ng-model="inserted.comment"></label>
						<br><input type="submit" value="Add" style="width:80px;">
						<hr>
						{{msg}}
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</div>
