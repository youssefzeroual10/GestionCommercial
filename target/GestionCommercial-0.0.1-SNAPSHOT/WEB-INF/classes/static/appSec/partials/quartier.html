<div class="view_contents" ng-controller="QuartierCtrl">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="row-fluid">
			<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable">
				<div class="box span12">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>Modification du quartier
							
						</h2>
					</div>
					<div class="box-content">
						<form class="form-horizontal" ng-submit="onUpdate()" novalidate="novalidate" name="formQuartier">
							<input type="hidden" name="id" ng-model="quartier.idQuartier">
							<fieldset>
								<div class="control-group">
									<label class="control-label" for="libelle" style="color:black;"> Quartier: </label>
									<div class="controls">
										<input type="text" ng-model="quartier.libelle"
											class="span6 typeahead" id="typeahead" name="libelle"
											data-provide="typeahead" data-items="4" required="required">
										<span class="help-block" ng-show="formQuartier.libelle.$error.required && ( formQuartier.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>
									</div>
								</div>
								<div class="control-group">
									<label class="control-label" for="ville" style="color:black;">Ville: </label>
										<div class="controls">
											<select class="span6 typeahead"   ng-model="quartier.ville.idVille" ng-options="v.idVille as v.libelle for v in villes" required="required" name="ville">
										</select>
										<span class="help-block" ng-show="formQuartier.ville.$error.required && ( formQuartier.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>
									</div>
								</div>
								<div class="control-group">
									<label class="control-label" for="user" style="color:black;">Chauffeur: </label>
										<div class="controls">
											<select class="span6 typeahead"   ng-model="quartier.user.idUser" ng-options="v.idUser as v.nom for v in users" required="required" name="user">
										</select>
										<span class="help-block" ng-show="formQuartier.user.$error.required && ( formQuartier.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>
									</div>
								</div>	
								<div class="form-actions">
									<button type="submit" class="btn btn-primary">Enregistrer
									</button>
									<button type="reset" class="btn">Quitter</button>
								</div>
							</fieldset>
						</form>

					</div>
				</div>
				<!--/span-->

			</div>

		</div>
	</div>
</div>
