
<div ng-controller="InsertCompetenceCtrl">
	<hr>
	<form ng-submit="saveNewCompetence()">
		<table>
			<caption>Insert new competence</caption>
			<tbody>
				<tr>
					<td>Title</td>
					<td><input type="text" name="title" ng-model="formData.title"></td>
				</tr>		
				<tr>
					<td>Categorie</td>
					<td>
						<select ng-model="formData.categorie" multiple>
							<option value=""></option>
						</select>
					</td>
				</tr>		
			</tbody>
		</table>
		<input type="submit" value="Save new competence">
		<hr>
		{{msg}}
	</form>
</div>
