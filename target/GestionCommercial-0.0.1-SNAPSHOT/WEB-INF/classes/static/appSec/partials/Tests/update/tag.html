<div ng-controller="UpdateTagCtrl">
	<h3>{{title}}</h3>
	<hr>
	<form ng-submit="UpdateTag()">
		<table>
			<caption>Update Tag</caption>
			<tbody>
				<tr>
					<td>id</td>
					<td><input type="text" name="id" ng-model="formData.id"></td>
				</tr>
				<tr>
					<td>Title</td>
					<td><input type="text" name="title" ng-model="formData.title"></td>
				</tr>
			</tbody>
		</table>
		<input type="submit" value="Update Tag">
		<hr>
		{{msg}}
	</form>
</div>
