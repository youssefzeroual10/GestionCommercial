<div class="view_contents" ng-controller="UserCtrl">
<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="box-header">
			<h2>
				<i class="halflings-icon white white hand-top"></i>
				<span class="break"></span>Menu
			</h2>
		</div>
		<div class="box-content">
			<a href="#/users" class="quick-button span2"> <i class="icon-group"></i>
				<p>Utilisateurs</p> <span class="notification blue">{{countUser}}</span>
			</a> 
			<a href="#/user" class="quick-button span2"> <i class="icon-user"></i><i class="icon-plus"></i>
				<p>Ajouter un utilisateur</p> 
			</a> 
			<a href="#/roles" class="quick-button span2"> <i class="icon-cogs"></i>
				<p>Roles</p>
			</a> 
			<div class="clearfix"></div>
		</div>
	</div>
	<!-- END Widget Menu-->	
	<div class="row-fluid">
		<!-- start of formulaire -->
		<div class="row-fluid sortable ui-sortable">
			<div class="box blue span12">
				<div class="row-fluid">
					<!-- start of formulaire -->
					<div class="row-fluid sortable ui-sortable">
						<div class="box span12">
							<div class="box-header" data-original-title="">
								<h2>
									<i class="halflings-icon white edit"></i><span class="break"></span>Ajout d'un utilisateur
									
								</h2>
							</div>
							<div class="box-content">
									<form class="form-horizontal" ng-submit="onUpdate()" novalidate="novalidate" form="formUser">
									<fieldset>
										<input type="hidden" ng-model="user.idUser"/>

											<label class="control-label" for="nom" style="color:black;"> nom : </label>
											<div class="controls">
												<input type="text" ng-model="user.nom" name="nom"
													class="span6 typeahead" id="typeahead"
													data-provide="typeahead" data-items="4" required="required">
												<span class="help-block" ng-show="formUser.nom.$error.required && ( formUser.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
											</div>
										</div>
										<div class="control-group">
											<label class="control-label" for="prenom" style="color:black;"> Prenom: </label>
											<div class="controls">
												<input type="text" ng-model="user.prenom" name="prenom"
													class="span6 typeahead" id="typeahead"
													data-provide="typeahead" data-items="4" required="required">
												<span class="help-block" ng-show="formUser.prenom.$error.required && ( formUser.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
											</div>
										</div>

													<label class="control-label" for="activation" style="color:black;"> activer : </label>

													<input type="radio" ng-model="user.actived" class="span6 typeahead" id="typeahead"

													<label class="control-label" for="activation" style="color:black;"> desactiver : </label>

														data-provide="typeahead" data-items="4" value="0" ng-checked="user.actived">

										<div class="control-group">
											<label class="control-label" for="adresse" style="color:black;"> Adresse: </label>
											<div class="controls">
												<input type="text" ng-model="user.adresse"
													class="span6 typeahead" id="typeahead" name="adresse"
													data-provide="typeahead" data-items="4" required="required">
												<span class="help-block" ng-show="formUser.adresse.$error.required && ( formUser.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
											</div>
										</div>
										<div class="control-group">
											<label class="control-label" for="email" style="color:black;"> Email: </label>
											<div class="controls">
												<input type="email" ng-model="user.email"
													class="span6 typeahead" id="typeahead" name="email"
													data-provide="typeahead" data-items="4" required="required">
												<span class="help-block" ng-show="formUser.email.$error.required && ( formUser.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
											</div>
										</div>
										<div class="control-group">
											<label class="control-label" for="telephone" style="color:black;"> Telephone: </label>
											<div class="controls">
												<input type="text" ng-model="user.telephone"
													class="span6 typeahead" id="typeahead" name="telephone"
													data-provide="typeahead" data-items="4" required="required">
												<span class="help-block" ng-show="formUser.telephone.$error.required && ( formUser.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
											</div>
										</div>
										<div class="control-group">
											<label class="control-label" for="telephone" style="color:black;"> Date embauche: </label>
											<div class="controls">
												</div>
													<input type="text" pattern="\d{1,2}/\d{1,2}/\d{4}" ng-model="user.dateEmbauche" class="datepicker" name="date" value="" required="required" />
													<span class="help-block" ng-show="formUser.date.$error.required && ( formUser.$submitted)" style="color:red" role="alert">
														vous devez remplir ce champ
													</span> 
										</div>
										<div class="control-group">
											<label class="control-label" for="user" style="color:black;">Role: </label>
											<div class="controls"  >
												<select class="span6"  ng-model="user.role" ng-options="role.role as role.role for role in roles" name="role" multiple="multiple" required>
												</select>
												<span class="help-block" ng-show="formUser.role.$error.required && ( formUser.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
												
											</div>
										</div>
										
											
										<div class="form-actions">
											<button type="submit" class="btn btn-primary">Enregistrer
											</button>
											<button type="reset" class="btn">Quitter</button>
										</div>

								</form>
		
							</div>
						</div>

					</div>
		
				</div>
			</div>
		</div>
	</div>		
</div>
