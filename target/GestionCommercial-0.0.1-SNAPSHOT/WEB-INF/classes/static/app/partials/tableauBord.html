<div class="view_contents" ng-controller="TableauBordCtrl">

	<div class="row-fluid">
	<div class="row-fluid sortable ui-sortable box span12"  >
		
			<div class="box span5"  style="margin-left:20px;margin-top:20px;">
			<label><center>meilleurs ann&eacute;es  </center> </label>
				<canvas id="base" class="chart-bar"
				  chart-data="data" chart-labels="labels" chart-colors="colors"
				  chart-dataset-override="datasetOverride" >
				</canvas>
			</div>
			<div class="box span5" ng-controller="NbrVenteMoisCtrl" style="margin-top:20px;">
				<label><center>meilleurs mois </center> </label>
				<canvas id="base2" class="chart-bar"
				  chart-data="data" chart-labels="labels" chart-colors="colors"
				  chart-dataset-override="dataset" >
				</canvas>
			</div>
			<div class="box span5" ng-controller="bestSlaesMonthCtrl" >
				<label><center>meilleur produits vendus</center> </label>
				<canvas id="pie" class="chart chart-pie"
				  chart-data="data" chart-labels="labels" chart-options="options" title="meilleur produits vendus">
				</canvas> 
			</div>
			<div class="box span5" ng-controller="bestFournisseurCtrl" style="margin-top:20px;">
				<label><center>meilleurs Fournisseurs </center> </label>
				<canvas id="base2" class="chart-bar"
				  chart-data="data" chart-labels="labels" chart-colors="colors"
				  chart-dataset-override="dataset" >
				</canvas>
			</div>
			<div class="box span5" ng-controller="bestVendeurCtrl" style="margin-top:20px;">
				<label><center>meilleurs Vendeurs </center> </label>
				<canvas id="base2" class="chart-bar"
				  chart-data="data" chart-labels="labels" chart-colors="colors"
				  chart-dataset-override="dataset" >
				</canvas>
			</div>
			<div class="box span5" ng-controller="bestClientCtrl" style="margin-top:20px;">
				<label><center>meilleurs Clients </center> </label>
				<canvas id="base2" class="chart-bar"
				  chart-data="data" chart-labels="labels" chart-colors="colors"
				  chart-dataset-override="dataset" >
				</canvas>
			</div>
			
		
	</div>	
				  
	</div>
</div>
