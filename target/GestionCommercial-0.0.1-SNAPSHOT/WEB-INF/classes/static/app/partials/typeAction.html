<div class="view_contents" ng-controller="TypeActionCtrl">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="box-header">
			<h2>
				<i class="halflings-icon white white hand-top"></i>
				<span class="break"></span>Menu
			</h2>
		</div>
		<div class="box-content">
			<a href="#/Actions" class="quick-button span2"> <i class="icon-group"></i>
				<p>Actions</p> <span class="notification blue">{{countAction}}</span>
			</a> 
			<a href="#/Action" class="quick-button span2"> <i class="icon-user"></i><i class="icon-plus"></i>
				<p>Ajouter un Action</p> 
			</a> 
			<a href="#/typesAction" class="quick-button span2"> <i class="icon-cogs"></i>
				<p>Type de Action</p>
			</a> 
			<a href="#/Actionsbalaye" class="quick-button span2"> <i class="icon-thumbs-up"></i>
				<p>Actions balay&eacute;s</p>
			</a> 
			<a href="#/Actionsnonbalaye" class="quick-button span2"> <i class="icon-thumbs-down"></i>
				<p>Actions non balay&eacute;s</p>
			</a>
			<a href="#/codes" class="quick-button span2"> <i class="icon-barcode"></i>
				<p>Gestion des codes</p>
			</a>  
			<div class="clearfix"></div>
		</div>
	</div>
	<!-- END Widget Menu-->
	
<div class="row-fluid">
	<!-- start of formulaire -->
	<div class="row-fluid sortable ui-sortable">
	<div class="box blue span12">
		<div class="row-fluid">
			<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable">
				<div class="box span12">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>Modification Type d'action
							
						</h2>
					</div>
					<div class="box-content">
						<form class="form-horizontal" ng-submit="onUpdate()" novalidate="novalidate" name="formTypeAction">
							<input type="hidden" name="id" ng-model="typeAction.idTypeAction">
							<fieldset>
								<div class="control-group">
									<label class="control-label" for="typeahead">Type Action: </label>
									<div class="controls">
										<input type="text" ng-model="typeAction.libelle"
											class="span6 typeahead" id="typeahead" name="libelle"
											data-provide="typeahead" data-items="4" required="required">
										<span class="help-block" ng-show="formTypeAction.libelle.$error.required && ( formTypeAction.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>	
									</div>
								</div>
								<div class="form-actions">
									<button type="submit" class="btn btn-primary">Enregistrer
									</button>
									<button type="reset" class="btn">Quitter</button>
								</div>
							</fieldset>
						</form>

					</div>
				</div>
				<!--/span-->

			</div>

		</div>
	</div>
</div>
