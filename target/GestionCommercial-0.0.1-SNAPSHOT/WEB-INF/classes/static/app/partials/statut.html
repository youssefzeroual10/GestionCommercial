<div ng-controller="StatutCtrl">
<form ng-submit="onUpdate()">
	<table>
		<tbody>
			<tr>
				<td>Edit Statut # {{ id }} :</td>
				<td>
					<form ng-submit="onUpdate()">
						<input type="hidden" name="id" ng-model="statut.id">
						<br><label>Full Name : <input type="text" ng-model="statut.caption"></label>
						<br><label>Short Name : <input type="text" name="title" ng-model="statut.comment"></label>
						<br><input type="submit" value="Save">
						<a href="#/statuts">Cancel</a>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
	<hr>
	{{msg}}
</form>
</div>
