<div class="view_contents" ng-controller="VilleCtrl">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="row-fluid">
			<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable">
				<div class="box span12">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>Modification de la Ville
							
						</h2>
					</div>
					<div class="box-content">
						<form class="form-horizontal" ng-submit="onUpdate()" novalidate="novalidate" name="formVille">
							<input type="hidden" name="id" ng-model="ville.idVille">
							<fieldset>
								<div class="control-group">
									<label class="control-label" for="typeahead" style="color:black">Ville: </label>
									<div class="controls">
										<input type="text" ng-model="ville.libelle"
											class="span6 typeahead" id="typeahead" name="libelle"
											data-provide="typeahead" data-items="4" required="required">
										<span class="help-block" ng-show="formVille.libelle.$error.required && ( formVille.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>
									</div>
								</div>
								<div class="form-actions">
									<button type="submit" class="btn btn-primary">Enregistrer
									</button>
									<button type="reset" class="btn">Quitter</button>
								</div>
							</fieldset>
						</form>

					</div>
				</div>
				<!--/span-->

			</div>

		</div>
	</div>
</div>
