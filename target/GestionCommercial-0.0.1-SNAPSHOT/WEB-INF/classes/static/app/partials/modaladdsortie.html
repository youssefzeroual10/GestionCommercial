<div class="modal-header">
  <h1>Ajouter une vente</h1>
</div>
<div ng-controller="SortiesCtrl" class="modal-body">
	<div class="row-fluid">
		<!-- start table-->
		<div class="row-fluid sortable ui-sortable box span12" style="padding:10px" >
				<div class="box span12" style="margin-right: 10px;">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>
							Ajouter une vente
						</h2>
					</div>
						<div class="box-content">
							<div class="box-content alerts" ng-show="msg">
								<div class="alert alert-error">
									<button type="button" class="close" data-dismiss="alert">X</button>
									<strong>Oh!!</strong> {{msg}}.
								</div>
							</div>
							<form class="form-horizontal" ng-submit="onInsert()" novalidate="novalidate" name="formSortie">
								<fieldset>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Article: </label>
										<div class="controls">
											<select name="article" ng-model="inserted.article" ng-change="getPrices(); getArticle()"  required="required">
												<option
													ng-repeat="article in articles track by article.idArticle"
														value="{{article.idArticle}}">{{article.designation}}
												</option>
											</select>
											<span class="help-block" ng-show="formSortie.article.$error.required && ( formSortie.$submitted)" style="color:red" role="alert">
												vous devez remplir ce champ
											</span> 
										</div>
									</div>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Prix vente: </label>
										<div class="controls">
											<select name="prixVente" ng-model="inserted.prixVente" required="required">
												<option
													ng-repeat="prix in prices
														 track by prix.idPrixArticle"
														value="{{prix.idPrixArticle}}">{{prix.prixVente}}
												</option>
											</select>
											<span class="help-block" ng-show="formSortie.prixVente.$error.required && ( formSortie.$submitted)" style="color:red" role="alert">
												vous devez remplir ce champ
											</span> 
										</div>	
									</div>
									<div class="control-group">
										<label class="control-label" for="adresse" style="color:black;"> Quantite: </label>
										<div class="controls">
											<input type="number" class="form-control" ng-model="inserted.quantite" name="quantite" min="1" max="{{article.quantite}}" required="required" />
											<span class="help-block" ng-show="formSortie.quantite.$error.required && ( formSortie.$submitted)" style="color:red" role="alert">
												vous devez remplir ce champ
											</span> 
										</div>
									</div>
									
										
									<div class="form-actions">
										<button type="submit" class="btn btn-primary">Enregistrer
										</button>
										<button type="reset" class="btn">Quitter</button>
									</div>
								</fieldset>
							</form>
	
						</div>
					</div>
		</div>
		<!-- end table  -->
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" ng-click="ok()">OK</button>
    <button class="btn btn-warning" ng-click="cancel()">Cancel</button>
</div>
