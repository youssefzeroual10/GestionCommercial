<div class="view_contents" ng-controller="PrixArticlesCtrl">
<div class="row-fluid">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="box-header">
			<h2>
				<i class="halflings-icon white white hand-top"></i>
				<span class="break"></span>Menu
			</h2>
		</div>
		<div class="box-content">
			<a href="#/articles" class="quick-button span2"> <i class="icon-table"></i>
				<p>Stock</p> <span class="notification blue">{{pageArticles.nombreArticles}}</span>
			</a> 
			<a href="#/article" class="quick-button span2"> <i class="icon-edit"></i>
				<p>Ajouter un article</p> 
			</a>
			<a href="#/prixarticle" class="quick-button span2"> <i class="icon-money"></i>
				<p>prix d'article</p>
			</a>  
			<a href="#/perimes" class="quick-button span2"> <i class="icon-warning-sign"></i>
				<p>Articles Bientot perim&eacute;s</p>
			</a> 
			<a href="#/promotions" class="quick-button span2"> <i class="icon-gift"></i>
				<p>Promotions</p>
			</a>
			<a href="#/defectueuse" class="quick-button span2"> <i class="icon-trash"></i>
				<p>Defectueur un article</p>
			</a>
			<div class="clearfix"></div>
		</div>
	</div>
	<!-- END Widget Menu-->

	<!-- start table-->
	<form class="form-horizontal" ng-submit="onInsert()" name="formPrice" novalidate="novalidate">
	<div class="row-fluid sortable ui-sortable">
		<div class="box span12">
			<div class="box-header" data-original-title="">
				<h2>
					<i class="halflings-icon white user"></i><span class="break"></span>Prix d'article
				</h2>
			</div>
			<div class="box-content">
				<div class="control-group">
					<label class="control-label" for="typeahead">Articles: </label>
					<div class="controls" >
						<select name="article" ng-model="inserted.article" ng-change="getArticle()" class="span6">
							<option  ng-repeat="article in articles track by article.idArticle " value="{{article.idArticle}}">{{article.designation}}</option>
						</select>
					</div>
				</div>
			</div>
		</div>
		<!--/span-->

	</div>
	<!-- end table  -->
	<div ng-show="inserted.article">
	<div class="row-fluid sortable ui-sortable">
		<div class="box span12">
			<div class="box-header" data-original-title="">
				<h2>
					<i class="halflings-icon white user"></i><span class="break"></span>Ajouter un prix
				</h2>
				<div class="box-icon">
					<span><a href="" class="btn-minimize" ng-click="showDetails = ! showDetails"><i class="halflings-icon white chevron-down"></i></a></span>
					<span><a href="" class="btn-close" ng-show="false"><i class="halflings-icon white remove"></i></a></span>
				</div>
			</div>
			
			<div class="box-content" ng-show="showDetails">
				
						<fieldset>
							
							<div class="control-group">
								<label class="control-label" for="typeahead">Libelle: </label>
								<div class="controls">
									<input type="text" ng-model="inserted.libelle"
										class="span6 typeahead" id="typeahead"
										name="libelle"
										data-provide="typeahead" data-items="4" required="required">
										<span class="help-block" ng-show="formPrice.libelle.$error.required && ( formPrice.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>
								</div>
							</div>
							<div class="control-group">
								<label class="control-label" for="typeahead">Prix: </label>
								<div class="controls">
									<input type="number" ng-model="inserted.prixVente"
										name="prixVente" step=any
										class="span6 typeahead" id="typeahead"
										data-provide="typeahead" data-items="4" required="required">
										<span class="help-block" ng-show="formPrice.prixVente.$error.required && ( formPrice.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>
								</div>
							</div>
							<div class="form-actions">
								<button type="submit" class="btn btn-primary">Enregistrer
								</button>
								<button type="reset" class="btn">Quitter</button>
							</div>
						</fieldset>
					
			</div>
			
		</div>
		<!--/span-->

	</div>
	<div class="row-fluid sortable ui-sortable">
		<div class="box span12">
			<div class="box-header" data-original-title="">
				<h2>
					<i class="halflings-icon white user"></i><span class="break"></span>Prix d'article
				</h2>
			</div>
			<div class="box-content">
				<div class="box-content">
					<table class="table table-striped">
						<thead>
							<tr>
								
								<th>libelle</th>
								<th>Prix</th>
								
							</tr>
						</thead>
						<tbody>
							<tr ng-repeat="prix in prices track by $index">
								<td class="span6 text-center">{{prix.libelle}}</td>
								<td class="span6 text-center">{{prix.prixVente}}</td>
								
								
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		<!--/span-->

	</div>
	</div>
	</form>
	<!-- end table  -->
</div>
</div>
