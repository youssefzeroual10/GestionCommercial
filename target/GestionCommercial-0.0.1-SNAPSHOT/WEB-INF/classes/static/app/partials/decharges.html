<div class="view_contents" ng-controller="SortiesCtrl">
	<div class="row-fluid">
		<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable box span12">
			<div class="box span12">
				<div class="box-header" data-original-title="">
					<h2>
						<i class="halflings-icon white edit"></i><span class="break"></span>
						Vendres des produits
					</h2>
				</div>
						<form ng-submit="addSortie()">
							<div class="box-content">
							<fieldset>
								<div class="table-responsive">
								<table class="table table-striped table-bordered" style="table-layout:fixed; width: 100%;">
									<thead>
										<tr>
											<th ><input type="checkbox" ng-model="selectedAll" ng-click="checkAll()" /></th>
											<th >Article</th>
											<th >Prix de Vente</th>
											<th >Quantite</th>
											<th >Total</th>
											<th >Action</th>
										</tr>
									</thead>
									<tbody>
							
										<tr ng-repeat="sortie in sorties track by $index">
											<td >
												<input type="checkbox" ng-model="sortie.selected"/>
												<input type="hidden" ng-model="sortie.idMouvement"/>
											</td>
											<td >
												<input type="text" ng-model="sortie.article.designation" disabled="disabled"/>
											</td>
											<td >
												<input type="text" ng-model="sortie.prixVente" disabled="disabled"/>
											</td>
											<td >
												<input type="number" class="form-control" ng-model="sortie.quantite" disabled="disabled" required />
											</td>
											<td >
												<input type="hidden" ng-model="sortie.total">
												<label>{{(0+sortie.prixVente)* (0+sortie.quantite)}}</label>
											</td>
											<td class="center" class="span6"> 
												<a class="btn btn-info" ng-click="showModalEdit(sortie.idMouvement)"> <i
														class=" halflings-icon plus-sign"></i>
												</a> 
											</td>
										</tr>
									</tbody>
								</table> 
								<div class="form-group">
									<input ng-hide="!sorties.length" type="button" class="btn btn-danger pull-right" ng-click="remove()" value="Remove"> 
									<input type="button" class="btn btn-primary addnew pull-right" value="Add New" ng-click="showModalAddSortie()"> 
									<input ng-hide="!sorties.length" type="submit" class="btn btn-success  pull-right" value="Valider">

								</div>
							</div>
							</fieldset>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
