<div class="modal-header">
  <h1>Ajouter une sous categorie</h1>
</div>
<div  class="modal-body">
	<div class="row-fluid">
		<!-- start table-->
		<div class="row-fluid sortable ui-sortable box span12" style="padding:10px" ng-controller="CommandeEntreeModalCtrl">
				<div class="box span12" style="margin-right: 10px;">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>Ajout
							des Sous Categories
						</h2>
					</div>
					<div class="box-content">
						<div class="box-content alerts" ng-show="msg">
							<div class="alert alert-error">
								<button type="button" class="close" data-dismiss="alert">X</button>
								<strong>Oh!!</strong> {{msg}}.
							</div>
						</div>
						<form class="form-horizontal" ng-submit="onInsert()" name="formCommande" novalidate="novalidate">
								<fieldset>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Code Commande #: </label>
										<div class="controls">
											<input type="text" ng-model="inserted.idCommande"
												class="span6 typeahead" id="typeahead"
												name="idCommande"
												data-provide="typeahead" data-items="4" required="required">
												<span class="help-block" ng-show="formCommande.idCommande.$error.required && ( formCommande.$submitted) " style="color:red" role="alert">
													vous devez remplir ce champ 
												</span> 
										</div>
									</div>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Montant: </label>
										<div class="controls">
											<input type="text" ng-model="inserted.montant"
												class="span6 typeahead" id="typeahead"
												name="montant"
												data-provide="typeahead" data-items="4" required="required">
												<span class="help-block" ng-show="formCommande.montant.$error.required && ( formCommande.$submitted) " style="color:red" role="alert">
													vous devez remplir ce champ 
												</span>
										</div>
									</div>
									<div class="control-group">
										<label class="control-label" for="adresse" style="color:black;"> Date Arrive: </label>
										<div class="controls">
											<input type="date" ng-model="inserted.dateCommande"
												class="span6 typeahead" id="typeahead"
												name="dateCommande"
												data-provide="typeahead" data-items="4" required="required">
												<span class="help-block" ng-show="formCommande.dateCommande.$error.required && ( formCommande.$submitted) " style="color:red" role="alert">
													vous devez remplir ce champ 
												</span>
										</div>
									</div>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Fournisseur: </label>
										<div class="controls">
											<select required name="fournisseur" ng-model="inserted.fournisseur" class="span6" >
												<option  ng-repeat="fournisseur in fournisseurs track by fournisseur.idFournisseur" value="{{fournisseur.idFournisseur}}">{{fournisseur.nom}}</option>
											</select>
											<span class="help-block" ng-show="formCommande.fournisseur.$error.required && ( formCommande.$submitted) " style="color:red" role="alert">
													vous devez remplir ce champ 
												</span>
										</div>
									</div>		
									<div class="form-actions">
										<button type="submit" class="btn btn-primary">Enregistrer
										</button>
										<button type="reset" class="btn">Quitter</button>
									</div>
								</fieldset>
							</form>
					</div>
			</div>
		</div>
		<!-- end table  -->
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" ng-click="ok()">OK</button>
    <button class="btn btn-warning" ng-click="cancel()">Cancel</button>
</div>
