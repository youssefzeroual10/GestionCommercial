<div class="modal-header">
  <h1>Ajouter un fournisseur</h1>
</div>
<div  class="modal-body">
	<div class="row-fluid">
		<!-- start table-->
		<div class="row-fluid sortable ui-sortable box span12" style="padding:10px" ng-controller="FournisseursCtrl">
				<div class="box span12" style="margin-right: 10px;">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>
							Ajouter un fournisseur
						</h2>
					</div>
						<div class="box-content">
							<form class="form-horizontal" ng-submit="onInsert()" name="formFournisseur" novalidate="novalidate">
								<fieldset>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Nom: </label>
										<div class="controls">
											<input type="text" ng-model="inserted.nom"
												class="span6 typeahead" id="typeahead"
												name="nom"
												data-provide="typeahead" data-items="4"
												required="required">
											<span class="help-block" ng-show="formFournisseur.nom.$error.required && ( formFournisseur.$submitted) " style="color:red" role="alert">
												vous devez remplir ce champ 
											</span> 
										</div>
									</div>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Ville: </label>
										<div class="controls">
											<input type="text" ng-model="inserted.ville"
												class="span6 typeahead" id="typeahead"
												name="ville"
												data-provide="typeahead" data-items="4"
												required="required">
												<span class="help-block" ng-show="formFournisseur.ville.$error.required && ( formFournisseur.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span>
										</div>
									</div>
									<div class="control-group">
										<label class="control-label" for="adresse" style="color:black;"> Adresse: </label>
										<div class="controls">
											<input type="text" ng-model="inserted.adresse"
												class="span6 typeahead" id="typeahead"
												name="adresse"
												data-provide="typeahead" data-items="4"
												required="required">
												<span class="help-block" ng-show="formFournisseur.adresse.$error.required && ( formFournisseur.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span>
										</div>
									</div>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Telephone: </label>
										<div class="controls">
											<input type="text" ng-model="inserted.telephone"
												class="span6 typeahead" id="typeahead"
												name="telephone"
												data-provide="typeahead" data-items="4"
												required="required">
												<span class="help-block" ng-show="formFournisseur.telephone.$error.required && ( formFournisseur.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span>
										</div>
									</div>
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Email: </label>
										<div class="controls">
											<input type="email" ng-model="inserted.email"
												class="span6 typeahead" id="typeahead"
												name="email"
												data-provide="typeahead" data-items="4"
												required="required">
											<span class="help-block" ng-show="formFournisseur.email.$error.required && ( formFournisseur.$submitted)" style="color:red" role="alert">
												vous devez remplir ce champ
											</span>
										</div>
									</div>
										
									<div class="form-actions">
										<button type="submit" class="btn btn-primary">Enregistrer
										</button>
										<button type="reset" class="btn">Quitter</button>
									</div>
								</fieldset>
							</form>
	
						</div>
					</div>
		</div>
		<!-- end table  -->
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" ng-click="ok()">OK</button>
    <button class="btn btn-warning" ng-click="cancel()">Cancel</button>
</div>
