<div class="view_contents" ng-controller="PaiementsCreditCtrl">
<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="box-header">
			<h2>
				<i class="halflings-icon white white hand-top"></i>
				<span class="break"></span>Menu
			</h2>
		</div>
		<div class="box-content">
			<a href="#/articles" class="quick-button span2"> <i class="icon-group"></i>
				<p>Liste des articles</p> <span class="notification blue">{{countArticle}}</span>
			</a> 
			<a href="#/article" class="quick-button span2"> <i class="icon-user"></i><i class="icon-plus"></i>
				<p>Ajouter un article</p> 
			</a> 
			<a href="#/roles" class="quick-button span2"> <i class="icon-cogs"></i>
				<p>Role</p>
			</a> 
			<a href="#/usersbalaye" class="quick-button span2"> <i class="icon-thumbs-up"></i>
				<p>users balay&eacute;s</p>
			</a> 
			<a href="#/usersnonbalaye" class="quick-button span2"> <i class="icon-thumbs-down"></i>
				<p>users non balay&eacute;s</p>
			</a> 
			<div class="clearfix"></div>
		</div>
	</div>
	<!-- END Widget Menu-->
<div class="row-fluid">
		<!-- start of formulaire -->
		<div class="row-fluid sortable ui-sortable">
			<div class="box span12">
				<div class="box-header" data-original-title="">
					<h2>
						<i class="halflings-icon white edit"></i><span class="break"></span>
						Choisir le mode de paiement
					</h2>
				</div>
				<div class="box-content" ng-show="finance.length">
					<h2><center>la commande # {{commande.idCommande}} a deja un paiement!!.</center></h2>
				</div>
				<div class="box-content" ng-show="!finance.length">
					<form class="form-horizontal" ng-submit="onInsert()">
					<div class="box-content alerts" ng-show="msg">
						<div class="alert alert-error">
							<button type="button" class="close" data-dismiss="alert">X</button>
							<strong>Oh!!</strong> {{msg}}.
						</div>
					</div>
						<fieldset>
							<div class="control-group">
								<label class="control-label" for="typeahead">La commande:# </label>
								<div class="controls">
									<input type="text" ng-model="idCommande"
										class="span6 typeahead" id="typeahead" data-provide="typeahead"
										data-items="4" >
										<label class="btn btn-primary" type="button" ng-click="onSearch()">Chercher</label>
									<input type="hidden" ng-model="commande.idCommande" >
								</div>
							</div>
							
							<div ng-show="co">
							<div ng-show="commande.statuts">
								<div><h2><center>cette commande est payé</center></h2></div>
							</div>
							<div ng-show="!commande.statuts">
								<div class="control-group">
									<label class="control-label" for="typeahead">Le Reste:# </label>
									<div class="controls">
										<input type="text" ng-model="commande.reste"
											class="span6 typeahead" id="typeahead" data-provide="typeahead"
											data-items="4" disabled="disabled" >
									</div>
								</div>
								<div class="control-group">
								<label class="control-label" for="typeahead">Le Montant: </label>
								<div class="controls">
									<input type="text" ng-model="commande.montant"
										class="span6 typeahead" id="typeahead" data-provide="typeahead"
										data-items="4" disabled="disabled">
									<input type="hidden" ng-model="commande.montant" >
								</div>
							</div>
							<div class="control-group">
								<label class="control-label" for="typeahead">Type Paiement: </label>
									<div class="controls"  >
										<select name="fournisseur" ng-model="commande.paiements" class="span6" ng-change="getPaiement()">
											<option  ng-repeat="paiement in paiements track by $index" value="{{paiement.libelle}}">{{paiement.libelle}}</option>
										</select>
									</div>
							</div>
							<div class="control-group" ng-show="cheque">
								<label class="control-label" for="typeahead">photo du cheque: </label>
								<div class="controls">
									<div class="uploader" id="uniform-fileInput">
										<input class="input-file uniform_on" file-model="commande.cheque" id="fileInput" type="file"  accept="image/*">
										<span class="filename" style="user-select: none;">aucun cheque</span>
										<span class="action" style="user-select: none;">choisisez une photo</span>
										
									 </div>
								</div>
							</div>
							<div ng-show="credit">
								<div class="control-group" >
									<label class="control-label" for="activation" style="color:black;"> Avance : </label>										
									<div class="controls">
										<label class="switcha">
										  <input type="checkbox" ng-modele="commande.type" ng-click="showDetails = ! showDetails">
										  <div class="slidera round"></div>
										</label>
									</div>
								</div>
								<div class="control-group" ng-show="showDetails" ng-hide="!showDetails">
									<label class="control-label" for="typeahead">Montant d'avance: </label>
									<div class="controls">
										<input type="number" ng-model="commande.avance"
											class="span6 typeahead" id="typeahead" data-provide="typeahead"
											data-items="4">
									</div>
								</div>
							</div>
							</div>
							</div>
							
							
							<div class="form-actions">
								<button ng-hide="!cheque"  type="submit" class="btn btn-primary">Enregistrer</button>
								<button ng-hide="!credit"  type="submit" class="btn btn-primary">Enregistrer</button>
								<button ng-hide="!espece"  type="submit" class="btn btn-primary">Enregistrer</button>			
								<button type="reset" class="btn">Quitter</button>
							</div>
						</fieldset>
					</form>
	
				</div>
			</div>
			<!--/span-->
		</div>
		<!-- end of formulaire -->
	</div>
</div>
