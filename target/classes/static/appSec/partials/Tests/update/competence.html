<div ng-controller="UpdateCompetenceCtrl">
	<h3>{{title}}</h3>
	<hr>
	<form ng-submit="UpdateCompetence()">
		<table>
			<caption>Update Competence</caption>
			<tbody>
				<tr>
					<td>id</td>
					<td><input type="text" name="id" ng-model="formData.id"></td>
				</tr>
				<tr>
					<td>Categorie</td>
					<td><select ng-model="formData.categorie"><option value="1" selected='true'>technologie</option></select></td>
				</tr>
				<tr>
					<td>Title</td>
					<td><input type="text" name="title" ng-model="formData.title"></td>
				</tr>
			</tbody>
		</table>
		<input type="submit" value="Update Competence">
		<hr>
		{{msg}}
	</form>
</div>
