<div ng-controller="UpdateProjetCtrl">
	<h3>{{title}}</h3>
	<hr>
	<form ng-submit="UpdateProjet()">
		<table>
			<caption>Update Projet</caption>
			<tbody>
				<tr>
					<td>id</td>
					<td><input type="text" name="id" ng-model="formData.id"></td>
				</tr>
				<tr>
					<td>Description</td>
					<td><input type="text" name="description" ng-model="formData.description"></td>
				</tr>
			</tbody>
		</table>
		<input type="submit" value="Update Projet">
		<hr>
		{{msg}}
	</form>
</div>
