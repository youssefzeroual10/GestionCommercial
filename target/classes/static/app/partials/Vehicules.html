<div class="view_contents" ng-controller="VehiculesCtrl">
	<div class="row-fluid">
		<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable box span12" style="padding:10px; margin-right:10px" >
			<div class="box span12" style="margin-right:10px;">
				<div class="box-header" data-original-title="">
					<h2>
						<i class="halflings-icon white edit"></i><span class="break"></span>Ajout
						des v&eacute;hicules
					</h2>
				</div>
				<div class="box-content">
					<form class="form-horizontal" ng-submit="onInsert()" novalidate="novalidate" name="formVehicule">
						
							<div class="control-group">
								<label class="control-label" for="typeahead">Immatriculation: </label>
								<div class="controls">
									<input type="text" ng-model="inserted.immatriculation"
										class="span6 typeahead" id="typeahead" name="immatriculation"
										data-provide="typeahead" data-items="4" required="required">
									<span class="help-block" ng-show="formVehicule.immatriculation.$error.required && ( formVehicule.$submitted)" style="color:red" role="alert">
										vous devez remplir ce champ
									</span>
								</div>
							</div>
							<div class="control-group">
								<label class="control-label" for="typeahead">Carte grise: </label>
								<div class="controls">
									<input type="text" ng-model="inserted.carteGrise"
										class="span6 typeahead" id="typeahead" name="carteGrise"
										data-provide="typeahead" data-items="4" required="required">
									<span class="help-block" ng-show="formVehicule.carteGrise.$error.required && ( formVehicule.$submitted)" style="color:red" role="alert">
										vous devez remplir ce champ
									</span>
								</div>
							</div>
							<div class="control-group">
									<label class="control-label" for="user" style="color:black;">Chauffeur: </label>
										<div class="controls">
											<select class="span6 typeahead"   ng-model="inserted.user" ng-options="v.idUser as v.nom for v in users" required="required" name="user">
										</select>
										<span class="help-block" ng-show="formVehicule.user.$error.required && ( formVehicule.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>
									</div>
								</div>	
							<div class="form-actions">
								<button type="submit" class="btn btn-primary">Enregistrer
								</button>
								<button type="reset" class="btn">Quitter</button>
							</div>
						
					</form>
				</div>
			</div>
			
				
			
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white user"></i><span class="break"></span>Liste
							des V&eacute;hicules
						</h2>
					</div>
					<div class="box-content">
						<div class="box-content">
							<table class="table  table-striped table-bordered">
								<thead>
									<tr>
										
										<th>Immatriculation</th>
										<th>Carte grise</th>
										<th>Chauffeur</th>
										<th>Actions</th>
									</tr>
								</thead>
								<tbody>
									<tr ng-repeat="vehicule in pageVehicules.vehicules track by $index">
										<td class="span6 text-center">{{vehicule.immatriculation}}</td>
										<td class="span6 text-center">{{vehicule.carteGrise}}</td>
										<td class="span6 text-center">{{vehicule.user.nom}} {{vehicule.user.prenom}}</td>
										<td class="center" class="span6"><a class="btn btn-info"
											href="#/vehicules/{{vehicule.immatriculation}}"> <i
												class="halflings-icon white edit"></i>
										</a> <a class="btn btn-danger"
											ng-click="onDelete(vehicule.immatriculation)"> <i
												class="halflings-icon white trash"></i>
										</a></td>
									</tr>
								</tbody>
							</table>
							<div class="pagination pagination-centered">
								<ul>
									<li style="cursor:pointer;" ng-class="{active:$index==pageCourante}"  ng-repeat="p in pages track by $index">
										<a ng-click="goToPage($index)">{{$index}}</a>
									</li>
								</ul>
							</div>
						</div>
					</div>
				</div>
				<!--/span-->

			</div>
		</div>
		
	
		<!-- end table  -->
