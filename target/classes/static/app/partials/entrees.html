<div class="view_contents" ng-controller="EntreesCtrl">
	<div class="row-fluid">
		<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable box span12">
			<div class="box span12">
				<div class="box-header" data-original-title="">
					<h2>
						<i class="halflings-icon white edit"></i><span class="break"></span>Ajout
						des Villes
					</h2>
				</div>
						<form ng-submit="addEntree()" name="formEntree" novalidate="novalidate">
							<div class="box-content">
							<div class="box-content alerts" ng-show="msg">
									<div class="alert alert-error">
										<button type="button" class="close" data-dismiss="alert">X</button>
										<strong>Oh!!</strong> {{msg}}.
									</div>
							</div>
							<fieldset>
								<div class="table-responsive">
								<table class="table table-striped table-bordered" style="table-layout:fixed; width: 100%;">
									<thead>
										<tr>
											<th ><input type="checkbox" ng-model="selectedAll" ng-click="checkAll()" /></th>
											<th >Article</th>
											<th >Prix Achat</th>
											<th >Quantite</th>
											<th >Date d'experation</th>
											<th >Total</th>
										</tr>
									</thead>
									<tbody>
							
										<tr ng-repeat="entree in entrees">
											<td >
												<input type="checkbox" ng-model="entree.selected"/>
											</td>
											<td >
												<select name="article" ng-model="entree.article" required="required">
													<option
														ng-repeat="article in articles track by article.idArticle"
														value="{{article.idArticle}}">{{article.designation}}
													</option> 													
												</select>
												<span class="help-block" ng-show="formEntree.article.$error.required && ( formEntree.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 	
												
											</td>
											
											<td >
												<input type="number" name="prixAchat" class="form-control" ng-model="entree.prixAchat" required="required" min="0" step=any />
												<span class="help-block" ng-show="formEntree.prixAchat.$error.required && ( formEntree.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
											</td>
											<td >
												<input type="number" name="quantite" class="form-control" ng-model="entree.quantite" required="required" min="0" step="1"/>
												<span class="help-block" ng-show="formEntree.quantite.$error.required && ( formEntree.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
											</td>
											<td >
												<input type="date" name="dateExpedition" class="form-control" ng-model="entree.dateExpedition"  required" />
												<span class="help-block" ng-show="formEntree.dateExpedition.$error.required && ( formEntree.$submitted)" style="color:red" role="alert">
													vous devez remplir ce champ
												</span> 
											</td>
											<td >
												<input type="hidden" ng-model="entree.total">
												<label>{{(0+entree.prixAchat)* (0+entree.quantite)}}</label>
											</td>
										</tr>
									</tbody>
								</table> 
								<div class="form-group">
									<input ng-hide="!entrees.length" type="button" class="btn btn-danger pull-right" ng-click="remove()" value="Remove"> 
									<input type="button" class="btn btn-primary addnew pull-right" value="Add New" ng-click="addNew()"> 
									<input ng-hide="!entrees.length" type="submit" class="btn btn-success  pull-right" value="Valider">

								</div>
							</div>
							</fieldset>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
