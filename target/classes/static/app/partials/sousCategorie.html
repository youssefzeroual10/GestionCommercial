<div class="view_contents" ng-controller="SousCategorieCtrl">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="row-fluid">
			<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable">
				<div class="box span12">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>Modification de sous categorie
							
						</h2>
					</div>
					<div class="box-content">
						<form class="form-horizontal" ng-submit="onUpdate()" name="formSousCategorie" novalidate="novalidate" >
							<input type="hidden" name="id" ng-model="sousCategorie.idSousCategorie">
							<fieldset>
								<div class="control-group">
									<label class="control-label" for="libelle" style="color:black;"> Sous Categorie: </label>
									<div class="controls">
										<input type="text" ng-model="sousCategorie.libelle"
											class="span6 typeahead" id="typeahead" name="libelle"
											data-provide="typeahead" data-items="4" required="required">
											<span class="help-block" ng-show="formSousCategorie.libelle.$error.required && ( formSousCategorie.$submitted)" style="color:red" role="alert">
											vous devez remplir ce champ
										</span>
									</div>
								</div>
								<div class="control-group">
									<label class="control-label" for="categorie" style="color:black;">Categorie: </label>
										<div class="controls">
										<select name="categorie" required="required" class="span6 typeahead"  ng-model="sousCategorie.categorie.idCategorie" ng-options="c.idCategorie as c.libelle for c in categories">
										</select>
										<span class="help-block" ng-show="formSousCategorie.categorie.$error.required && ( formSousCategorie.$submitted)" style="color:red" role="alert">
										vous devez remplir ce champ
									</span>
									</div>
								</div>	
								<div class="form-actions">
									<button type="submit" class="btn btn-primary">Enregistrer
									</button>
									<button type="reset" class="btn">Quitter</button>
								</div>
							</fieldset>
						</form>

					</div>
				</div>
				<!--/span-->

			</div>

		</div>
	</div>
</div>
