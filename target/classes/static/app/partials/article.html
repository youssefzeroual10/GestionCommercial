<div class="view_contents" ng-controller="ArticleCtrl">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="box-header">
			<h2>
				<i class="halflings-icon white white hand-top"></i>
				<span class="break"></span>Menu
			</h2>
		</div>
		<div class="box-content">
			<a href="#/articles" class="quick-button span2"> <i class="icon-table"></i>
				<p>Stock</p> <span class="notification blue">{{pageArticles.nombreArticles}}</span>
			</a> 
			<a href="#/article" class="quick-button span2"> <i class="icon-edit"></i>
				<p>Ajouter un article</p> 
			</a>
			<a href="#/prixarticle" class="quick-button span2"> <i class="icon-money"></i>
				<p>prix d'article</p>
			</a>  
			<a href="#/perimes" class="quick-button span2"> <i class="icon-warning-sign"></i>
				<p>Articles Bientot perim&eacute;s</p>
			</a> 
			<a href="#/promotions" class="quick-button span2"> <i class="icon-gift"></i>
				<p>Promotions</p>
			</a>
			<a href="#/defectueuse" class="quick-button span2"> <i class="icon-trash"></i>
				<p>Defectueur un article</p>
			</a>
			<div class="clearfix"></div>
		</div>
	</div>
	<!-- END Widget Menu-->
	<div class="row-fluid">
		<!-- start of formulaire -->
		<div class="row-fluid sortable ui-sortable">
			<div class="box blue span12">
				<div class="row-fluid">
					<!-- start of formulaire -->
					<div class="row-fluid sortable ui-sortable">
						<div class="box span12">
							<div class="box-header" data-original-title="">
								<h2>
									<i class="halflings-icon white edit"></i><span class="break"></span>Modification de l'Article
									
								</h2>
							</div>
							<div class="box-content">
								<form class="form-horizontal" ng-submit="onUpdate()">
									<input type="hidden" name="id" ng-model="article.idArticle">
									<fieldset>
								<div class="control-group">
									<label class="control-label" for="typeahead" style="color:black">D&eacute;signation: </label>
									<div class="controls">
										<input type="text" ng-model="article.designation"
											class="span6 typeahead" id="typeahead" data-provide="typeahead"
											data-items="4">
									</div>
								</div>
								<div class="control-group">
									<label class="control-label" for="typeahead"  style="color:black">Fournisseur: </label>
										<div class="controls"  >
											<select   ng-model="article.fournisseur.idFournisseur" ng-options="f.idFournisseur as f.nom for f in fournisseurs">
											</select>
										</div>
								</div>
								<div class="control-group">
									<label class="control-label" for="typeahead" style="color:black">Sous Cat&eacute;gorie: </label>
										<div class="controls"  >
											<select   ng-model="article.sousCategorie.idSousCategorie" ng-options="s.idSousCategorie as s.libelle for s in sousCategories">
											</select>
										</div>
								</div>
								
								
								<div class="control-group">
									<label class="control-label" for="typeahead"  style="color:black">Seuil d'alert: </label>
									<div class="controls">
										<input type="number" ng-model="article.seuilAlert"
											class="span6 typeahead" id="typeahead" data-provide="typeahead"
											data-items="4">
									</div>
								</div>
								<div class="form-actions">
									<button type="submit" class="btn btn-primary">Enregistrer
									</button>
									<button type="reset" class="btn">Quitter</button>
								</div>
							</fieldset>
								</form>
		
							</div>
						</div>
						<!--/span-->
		
					</div>
		
				</div>
			</div>
		</div>	
	</div>
</div>
