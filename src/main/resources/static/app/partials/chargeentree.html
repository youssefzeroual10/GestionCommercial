<div class="view_contents" ng-controller="ChargeEntreeCtrl">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="box-header">
			<h2>
				<i class="halflings-icon white white hand-top"></i>
				<span class="break"></span>Menu
			</h2>
		</div>
		<div class="box-content">
			<a href="#/commandes" class="quick-button span2"> <i class="glyphicons-icon barcode"></i>
				<p>Commandes</p>
			</a> 
			<a href="#/commandevente" class="quick-button span2"> <i class="glyphicons-icon inbox_out"></i>
				<p>Les ventes</p> 
			</a> 
			<a href="#/commande" class="quick-button span2"> <i class="glyphicons-icon inbox_in"></i>
				<p>Les Achats</p>
			</a> 
			<a href="#/commandeform" class="quick-button span2"> <i class="glyphicons-icon shopping_cart"></i>
				<p>Acheter</p>
			</a> 
			<a href="#/commandesortieform" class="quick-button span2"> <i class="glyphicons-icon coins"></i>
				<p>Vendre</p>
			</a>
			<a href="#/finDeJournee" class="quick-button span2"> <i class="glyphicons-icon eye_open"></i>
				<p>fin de la journee</p>
			</a> 
			<div class="clearfix"></div>
		</div>
	</div>
	<!-- END Widget Menu-->
<div class="row-fluid">
	<!-- start of formulaire -->
	<div class="row-fluid sortable ui-sortable">
		<div class="box blue span12">
			<div class="row-fluid">
				<!-- start of formulaire -->
				<div class="row-fluid sortable ui-sortable">
					<div class="box span12">
						<div class="box-header" data-original-title="">
							<h2>
								<i class="halflings-icon white edit"></i><span class="break"></span>Charger un camion
								
							</h2>
						</div>
						<div class="box-content">
							<div class="box-content alerts" ng-show="msg">
								<div class="alert alert-error">
									<button type="button" class="close" data-dismiss="alert">X</button>
									<strong>Oh!!</strong> {{msg}}.
								</div>
							</div>
							<form class="form-horizontal" ng-submit="onInsert()" novalidate="novalidate" name="formCharge">
								<fieldset>
									
									<div class="control-group">
										<label class="control-label" for="nom" style="color:black;"> Chauffeur: </label>
										<div class="controls">
											<select  name="user" ng-model="inserted.user" class="span6" required="required" >
												<option  ng-repeat="user in users track by user.idUser" value="{{user.idUser}}">{{user.nom}}</option>
											</select>
											<span class="help-block" ng-show="formCharge.user.$error.required && ( formCharge.$submitted)" style="color:red" role="alert">
												vous devez remplir ce champ
											</span>
											
										</div>
									</div>		
									<div class="form-actions">
										<button type="submit" class="btn btn-primary">Enregistrer
										</button>
										<button type="reset" class="btn">Quitter</button>
									</div>
								</fieldset>
							</form>
	
						</div>
					</div>
					<!--/span-->
	
				</div>
	
			</div>
		</div>
	</div>
</div>
