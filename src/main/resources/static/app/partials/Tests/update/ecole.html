<div ng-controller="UpdateEcoleCtrl">
	<h3>{{title}}</h3>
	<hr>
	<form ng-submit="UpdateEcole()">
		<table>
			<caption>Update Ecole</caption>
			<tbody>
				<tr>
					<td>id</td>
					<td><input type="text" name="id" ng-model="formData.id"></td>
				</tr>
				<tr>
					<td>name</td>
					<td><input type="text" name="name" ng-model="formData.name"></td>
				</tr>
				<tr>
					<td>city</td>
					<td><input type="text" name="city" ng-model="formData.city"></td>
				</tr>
			</tbody>
		</table>
		<input type="submit" value="Update Ecole">
		<hr>
		{{msg}}
	</form>
</div>
