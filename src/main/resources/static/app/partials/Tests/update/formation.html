<div ng-controller="UpdateFormationCtrl">
	<h3>{{title}}</h3>
	<hr>
	<form ng-submit="UpdateFormation()">
		<table>
			<caption>Update Formation</caption>
			<tbody>
				<tr>
					<td>id</td>
					<td><input type="text" name="id" ng-model="formData.id"></td>
				</tr>
				<tr>
					<td>Title</td>
					<td><input type="text" name="title" ng-model="formData.title"></td>
				</tr>
			</tbody>
		</table>
		<input type="submit" value="Update Formation">
		<hr>
		{{msg}}
	</form>
</div>
