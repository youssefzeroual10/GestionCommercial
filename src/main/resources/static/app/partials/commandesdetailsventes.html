<div class="view_contents" ng-controller="CommandesDetailVenteCtrl">
<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="box-header">
			<h2>
				<i class="halflings-icon white white hand-top"></i>
				<span class="break"></span>Menu
			</h2>
		</div>
		<div class="box-content">
			<a href="#/commandes" class="quick-button span2"> <i class="glyphicons-icon barcode"></i>
				<p>Commandes</p>
			</a> 
			<a href="#/commandevente" class="quick-button span2"> <i class="glyphicons-icon inbox_out"></i>
				<p>Les ventes</p> 
			</a> 
			<a href="#/commande" class="quick-button span2"> <i class="glyphicons-icon inbox_in"></i>
				<p>Les Achats</p>
			</a> 
			<a href="#/commandeform" class="quick-button span2"> <i class="glyphicons-icon shopping_cart"></i>
				<p>Acheter</p>
			</a> 
			<a href="#/commandesortieform" class="quick-button span2"> <i class="glyphicons-icon coins"></i>
				<p>Vendre</p>
			</a>
			<a href="#/finDeJournee" class="quick-button span2"> <i class="glyphicons-icon eye_open"></i>
				<p>fin de la journee</p>
			</a> 
			<div class="clearfix"></div>
		</div>
	</div>
	<!-- END Widget Menu-->
	
<div class="row-fluid">
	<!-- start table-->
	<div class="row-fluid sortable ui-sortable">
		<div class="box span12">
			<div class="box-header" data-original-title="">
				<h2>
					<i class="halflings-icon white user"></i><span class="break"></span>Liste des commandes 
				</h2>
			</div>
			<div class="box-content">
				<form class="form-horizontal" ng-submit="onSearch()" >
				
				<div class="box-content">
					<div class="control-group" >
						Jour :&nbsp;
							<select class="span2 typeahead" ng-model="search.day">
								<option></option>
								<option value="1">1</option><option value="2">2</option>
								<option value="3">3</option><option value="3">3</option>
								<option value="4">4</option><option value="5">5</option>
								<option value="6">6</option><option value="7">7</option>
								<option value="8">8</option><option value="9">9</option>
								<option value="10">10</option><option value="11">11</option>
								<option value="12">12</option><option value="13">13</option>
								<option value="14">14</option><option value="15">15</option>
								<option value="16">16</option><option value="17">17</option>
								<option value="18">18</option><option value="19">19</option>
								<option value="20">20</option><option value="21">21</option>
								<option value="22">22</option><option value="23">23</option>
								<option value="24">24</option><option value="25">25</option>
								<option value="26">26</option><option value="27">27</option>
								<option value="28">28</option><option value="29">29</option>
								<option value="30">30</option><option value="31">31</option>
								
							</select>
						&nbsp;Mois :&nbsp;
							<select class="span2 typeahead" ng-model="search.month">
							    <option></option>
								<option>01</option><option>02</option>
								<option>03</option><option>04</option>
								<option>05</option><option>06</option>
								<option>07</option><option>08</option>
								<option>09</option><option>10</option>
								<option>11</option><option>12</option>
							</select>
						&nbsp;Ann&eacute;e :&nbsp;
							<select class="span2 typeahead" ng-model="search.year">
								<option></option>
								<option>2000</option><option>2001</option><option>2002</option>
								<option>2003</option><option>2004</option><option>2005</option>
								<option>2006</option><option>2007</option><option>2008</option>
								<option>2009</option><option>2010</option><option>2011</option>
								<option>2012</option><option>2013</option><option>2014</option>
								<option>2015</option><option>2016</option><option>2017</option>
								<option>2018</option><option>2019</option><option>2020</option>
								<option>2021</option><option>2022</option><option>2023</option>
								<option>2024</option><option>2025</option><option>2026</option>
							</select>
							&nbsp;<input type="submit" value="Chercher" class="btn btn-primary">
													
					</div>
					<table class="table table-striped">
						<thead>
							<tr>
								<th>#</th>
								<th>Date Commande</th>
								<th>montant</th>
							</tr>
						</thead>
						<tbody>
							<tr ng-repeat="commande in pageCommandes.commande track by $index">
								<td class="span6 text-center">
									<a class="btn btn-info" href="#/getpaiements?idCommande={{commande.idCommande}}">
									{{commande.idCommande}}</a>
								</td>
								<td class="span6 text-center">{{commande.dateCommande}}</td>
								<td class="span6 text-center">{{commande.montant}}</td>
							</tr>
						</tbody>
					</table>
					<div class="pagination pagination-centered">
						<ul>
							<li style="cursor:pointer;" ng-class="{active:$index==pageCourante}"  ng-repeat="p in pages track by $index">
								<a ng-click="goToPage($index)">{{$index}}</a>
							</li>
						</ul>
					</div>
				</div>
				</form>
			</div>
		</div>
		<!--/span-->

	</div>

	<!-- end table  -->
</div>
</div>
