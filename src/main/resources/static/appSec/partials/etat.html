<div class="view_contents" ng-controller="EtatCtrl">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="row-fluid">
			<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable">
				<div class="box span12">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>Modification de l'Etat
							
						</h2>
					</div>
					<div class="box-content">
						<form class="form-horizontal" ng-submit="onUpdate()">
							<input type="hidden" name="id" ng-model="etat.idEtat">
							<fieldset>
								<div class="control-group">
									<label class="control-label" for="typeahead">Etat: </label>
									<div class="controls">
										<input type="text" ng-model="etat.libelle"
											class="span6 typeahead" id="typeahead"
											data-provide="typeahead" data-items="4">
									</div>
								</div>
								<div class="form-actions">
									<button type="submit" class="btn btn-primary">Enregistrer
									</button>
									<button type="reset" class="btn">Quitter</button>
								</div>
							</fieldset>
						</form>

					</div>
				</div>
				<!--/span-->

			</div>

		</div>
	</div>
</div>
