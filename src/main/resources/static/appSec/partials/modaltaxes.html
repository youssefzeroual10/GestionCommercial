<div class="modal-header">
  <h1>Ajouter la TVA</h1>
</div>
<div ng-controller="ArticlesCtrl" class="modal-body">
	<div class="row-fluid">
		<!-- start table-->
		<div class="row-fluid sortable ui-sortable box span12" style="padding:10px" ng-controller="TaxesCtrl">
				<div class="box span12" style="margin-right: 10px;">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>
							Ajoter la TVA
						</h2>
					</div>
					<div class="box-content">
						<form class="form-horizontal" ng-submit="onInsert()">
							<fieldset>
								<div class="control-group">
									<label class="control-label" for="typeahead">Taux: </label>
									<div class="controls">
										<input type="text" ng-model="inserted.taux"
											class="span6 typeahead" id="typeahead" data-provide="typeahead"
											data-items="4">
									</div>
								</div>
								<div class="form-actions">
									<button type="submit" class="btn btn-primary">Enregistrer
									</button>
								</div>
							</fieldset>
						</form>

					</div>
			</div>
		</div>
		<!-- end table  -->
	</div>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" ng-click="ok()">OK</button>
    <button class="btn btn-warning" ng-click="cancel()">Cancel</button>
</div>
