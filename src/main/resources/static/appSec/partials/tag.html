<div ng-controller="tagCtrl">
	<form ng-submit="onUpdate()">
		<table>
			<tbody>
				<tr>
					<td>Edit tag # {{ id }} :</td>
					<td>
						<form ng-submit="onUpdate()">
							<input type="hidden" name="id" ng-model="tag.id">
							Candidat :
							<select ng-model="tag.candidat.id"  ng-options="cand.id as cand.first_name+' '+cand.last_name for cand in candidats">
							</select>
							<input type="text" name="title" ng-model="tag.title">
							<input type="text" name="comment" ng-model="tag.comment">
							<input type="submit" value="Save">
							<a href="#/tags">Cancel</a>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
		<hr>
		{{msg}}
	</form>
</div>
