<div class="view_contents" ng-controller="RoleCtrl">
	<!-- Widget Menu-->
	<div class="box blue span12">
		<div class="box-header">
			<h2>
				<i class="halflings-icon white white hand-top"></i>
				<span class="break"></span>Menu
			</h2>
		</div>
		<div class="box-content">
			<a href="#/users" class="quick-button span2"> <i class="icon-group"></i>
				<p>Utilisateurs</p> <span class="notification blue">{{countUser}}</span>
			</a> 
			<a href="#/user" class="quick-button span2"> <i class="icon-user"></i><i class="icon-plus"></i>
				<p>Ajouter un Utilisateur</p> 
			</a> 
			<a href="#/roles"  class="quick-button span2"> <i class="icon-cogs"></i>
				<p>Role</p>
			</a> 
			<div class="clearfix"></div>
		</div>
	</div>
	<!-- END Widget Menu-->	
	
	<div class="box blue span12">
		<div class="row-fluid">
			<!-- start of formulaire -->
			<div class="row-fluid sortable ui-sortable">
				<div class="box span12">
					<div class="box-header" data-original-title="">
						<h2>
							<i class="halflings-icon white edit"></i><span class="break"></span>Modification du role
							
						</h2>
					</div>
					<div class="box-content">
						<form class="form-horizontal" ng-submit="onUpdate()">
							<input type="hidden" name="id" ng-model="role.role">
							<fieldset>
								<div class="control-group">
									<label class="control-label" for="typeahead">Role: </label>
									<div class="controls">
										<input type="text" ng-model="role.role"
											class="span6 typeahead" id="typeahead"
											data-provide="typeahead" data-items="4" readonly="readonly">
									</div>
								</div>
								<div class="control-group">
									<label class="control-label" for="typeahead">Description: </label>
									<div class="controls">
										<input type="text" ng-model="role.description"
											class="span6 typeahead" id="typeahead"
											data-provide="typeahead" data-items="4">
									</div>
								</div>
								<div class="form-actions">
									<button type="submit" class="btn btn-primary">Enregistrer
									</button>
									<button type="reset" class="btn">Quitter</button>
								</div>
							</fieldset>
						</form>

					</div>
				</div>
				<!--/span-->

			</div>

		</div>
	</div>
</div>
